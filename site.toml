en = "Counterexamples to Conjectures 3 and 4 of Huang, Stoica, Xia and Zhong (arXiv:2006.06716v1, Section 5.2, printed page 32)"
[trureturing]
repo = "the-omega-institute/trureturing"
branch = "dev"
[books]
order = ["huang-stoica-xia-zhong-2020-tree-equations-nonconstant"]
